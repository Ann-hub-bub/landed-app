<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Full Job Posting — Landed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0a0a0a;
  --ink-2:#101013;
  --ink-3:#16161a;
  --ink-4:#1c1c22;
  --line:#22222a;
  --line-2:#2c2c34;
  --bone:#f4ede0;
  --bone-2:#d9d2c4;
  --mute:#8a8a92;
  --mute-2:#6a6a72;
  --orange:#ff6a1f;
  --orange-soft:#ffa56a;
  --green:#5ef0a8;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--bone);}
body{font-family:'Inter',system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}

/* ── Nav ── */
nav.top{position:sticky;top:0;z-index:50;background:rgba(10,10,10,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.nav-inner{max-width:1200px;margin:0 auto;padding:0 48px;display:flex;align-items:center;justify-content:space-between;height:64px;}
.nav-logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;letter-spacing:-.02em;color:var(--bone);}
.nav-logo span{color:var(--orange);}
.nav-back{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px;transition:color .18s;}
.nav-back:hover{color:var(--bone);}
.nav-cta{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;background:var(--orange);color:var(--ink);font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;letter-spacing:.02em;border:none;transition:opacity .18s;text-decoration:none;}
.nav-cta:hover{opacity:.88;}

/* ── Wrap ── */
.wrap{max-width:1200px;margin:0 auto;padding:0 48px;}

/* ── Hero ── */
.jd-hero{padding:32px 0 0;border-bottom:1px solid var(--line);position:relative;overflow:hidden;}
.jd-hero-inner{display:grid;grid-template-columns:1fr 320px;gap:32px;align-items:end;}
.jd-hero-left{padding-bottom:24px;}
.jd-back-crumb{position:fixed;top:80px;left:24px;z-index:40;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);background:var(--ink-3);border:1px solid var(--line);padding:8px 14px;text-decoration:none;transition:color .18s, box-shadow .18s;}
.jd-back-crumb:hover{color:var(--orange);box-shadow:0 2px 12px rgba(0,0,0,.4);}
.jd-company-row{display:flex;align-items:center;gap:14px;margin-bottom:20px;}
.jd-logo{width:44px;height:44px;background:var(--ink-3);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;color:var(--bone);flex:0 0 auto;}
.jd-company-name{font-size:15px;color:var(--mute);}
.jd-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(28px,4vw,42px);line-height:1.05;letter-spacing:-.03em;margin:0 0 20px;}
.jd-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px;}
.jd-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border:1px solid var(--line-2);font-size:12px;color:var(--bone-2);}
.jd-chip.match{background:rgba(255,106,31,.12);border-color:rgba(255,106,31,.3);color:var(--orange);font-family:'Space Grotesk',sans-serif;font-weight:700;}
.jd-chip.salary{background:rgba(94,240,168,.07);border-color:rgba(94,240,168,.2);color:var(--green);}
.jd-hero-joe{display:flex;align-items:flex-end;justify-content:center;position:relative;}
.jd-hero-joe::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,106,31,.12) 0%,transparent 70%);}
.jd-hero-joe img{position:relative;z-index:2;width:260px;height:auto;filter:drop-shadow(0 30px 60px rgba(255,106,31,.3));}

/* ── Section wrapper ── */
.jd-section{padding:32px 0;border-bottom:1px solid var(--line);}
.jd-section:last-child{border-bottom:0;}
.jd-label{font-size:11px;color:var(--orange);font-family:'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px;}
.jd-h2{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(22px,3vw,30px);letter-spacing:-.025em;margin:0 0 16px;line-height:1.1;}
.jd-body{font-size:15px;line-height:1.7;color:var(--bone-2);}
.jd-body b{color:var(--bone);font-weight:600;}

/* ── Meta facts ── */
.jd-meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);}
.jd-meta-cell{background:var(--ink-2);padding:14px 18px;}
.jd-meta-cell .mc-label{font-size:10px;color:var(--mute);letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px;}
.jd-meta-cell .mc-val{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;color:var(--bone);}
.jd-meta-cell .mc-val.green{color:var(--green);}
.jd-meta-cell .mc-val.orange{color:var(--orange);}

/* ── Context ── */
.jd-context-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
.jd-stage-badge{display:inline-block;padding:5px 12px;background:rgba(255,106,31,.1);border:1px solid rgba(255,106,31,.25);color:var(--orange);font-size:11px;font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:16px;}
.jd-why-box{background:var(--ink-3);border:1px solid var(--line-2);padding:16px 20px;}
.jd-why-box .wb-label{font-size:10px;color:var(--mute);letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px;}
.jd-why-box p{font-size:14px;line-height:1.65;color:var(--bone-2);margin:0;}

/* ── Goals 30/90/365 ── */
.jd-goals-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.jd-goal-card{background:var(--ink-3);border:1px solid var(--line-2);padding:20px 18px;position:relative;}
.jd-goal-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.jd-goal-card:nth-child(1)::before{background:var(--line-2);}
.jd-goal-card:nth-child(2)::before{background:rgba(255,106,31,.5);}
.jd-goal-card:nth-child(3)::before{background:var(--orange);}
.jd-goal-period{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:28px;color:var(--orange);margin-bottom:4px;}
.jd-goal-unit{font-size:11px;color:var(--mute);letter-spacing:.12em;text-transform:uppercase;margin-bottom:16px;}
.jd-goal-text{font-size:13.5px;line-height:1.6;color:var(--bone-2);}

/* ── Skills ── */
.jd-skills-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-bottom:36px;}
.jd-skills-col-h{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:0 0 16px;}
.jd-must-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px;}
.jd-must-list li{display:flex;gap:14px;font-size:14px;line-height:1.5;color:var(--bone-2);}
.jd-must-list .num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--orange);min-width:18px;margin-top:2px;}
.jd-nice-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;}
.jd-nice-list li{display:flex;gap:10px;font-size:14px;color:var(--bone-2);line-height:1.5;}
.jd-nice-list .ck{color:var(--mute);font-size:12px;margin-top:2px;}
.jd-stack-label{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:12px;}
.jd-stack-chips{display:flex;flex-wrap:wrap;gap:8px;}
.jd-stack-chip{padding:5px 12px;background:var(--ink-3);border:1px solid var(--line-2);font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--bone-2);}

/* ── Team ── */
.jd-team-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);}
.jd-team-cell{background:var(--ink-2);padding:16px 20px;}
.jd-team-cell .tc-label{font-size:10px;color:var(--mute);letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px;}
.jd-team-cell .tc-val{font-size:14px;line-height:1.5;color:var(--bone-2);}
.jd-team-cell .tc-val b{color:var(--bone);font-weight:600;}

/* ── Benefits ── */
.jd-benefits-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;}
.jd-benefit{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;background:var(--ink-3);border:1px solid var(--line-2);}
.jd-benefit .bi{width:30px;height:30px;background:rgba(255,106,31,.1);border:1px solid rgba(255,106,31,.18);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.jd-benefit .bi svg{width:14px;height:14px;color:var(--orange);}
.jd-benefit .bt{font-size:13.5px;line-height:1.45;color:var(--bone-2);}

/* ── Hiring process ── */
.jd-pipeline{display:flex;flex-direction:column;gap:0;}
.jd-pipe-step{display:grid;grid-template-columns:56px 1fr;gap:0;position:relative;}
.jd-pipe-step:not(:last-child)::before{content:'';position:absolute;left:27px;top:44px;bottom:-1px;width:2px;background:var(--line-2);}
.jd-pipe-num{display:flex;align-items:flex-start;justify-content:center;padding-top:8px;}
.jd-pipe-badge{width:36px;height:36px;border-radius:50%;background:var(--ink-3);border:2px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;color:var(--mute);z-index:1;transition:border-color .3s,color .3s;}
.jd-pipe-step.active .jd-pipe-badge{border-color:var(--orange);color:var(--orange);}
.jd-pipe-content{padding:4px 0 18px 16px;}
.jd-pipe-head{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
.jd-pipe-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:var(--bone);}
.jd-pipe-dur{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--orange);padding:2px 8px;border:1px solid rgba(255,106,31,.3);}
.jd-pipe-desc{font-size:13.5px;color:var(--mute);line-height:1.55;}

/* ── CTA ── */
.jd-cta{padding:48px 0;text-align:center;position:relative;overflow:hidden;}
.jd-cta::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(255,106,31,.08) 0%,transparent 65%);}
.jd-cta-inner{position:relative;z-index:2;}
.jd-cta-joe{display:flex;justify-content:center;margin-bottom:20px;}
.jd-cta-joe img{width:200px;height:auto;filter:drop-shadow(0 20px 40px rgba(255,106,31,.35));}
.jd-cta h2{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(28px,4vw,42px);letter-spacing:-.03em;margin:0 0 12px;line-height:1.1;}
.jd-cta p{font-size:15px;color:var(--mute);margin:0 0 32px;}
.jd-cta-btn{display:inline-flex;align-items:center;gap:10px;padding:18px 40px;background:var(--orange);color:var(--ink);font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;letter-spacing:.01em;border:none;transition:opacity .18s,transform .18s;text-decoration:none;}
.jd-cta-btn:hover{opacity:.9;transform:translateY(-2px);}
.jd-cta-btn .ar{font-size:18px;}
.jd-guarantee{margin-top:20px;font-size:12px;color:var(--mute-2);}
.jd-guarantee b{color:var(--mute);}

/* ── Responsive ── */
@media(max-width:860px){
  .nav-inner,.wrap{padding:0 24px;}
  .jd-hero-inner{grid-template-columns:1fr;}
  .jd-hero-joe{display:none;}
  .jd-context-grid,.jd-skills-grid{grid-template-columns:1fr;}
  .jd-goals-grid{grid-template-columns:1fr;}
  .jd-team-grid{grid-template-columns:1fr;}
}
</style>
</head>

              <div class="jd-pipe-num"><div class="jd-pipe-badge">${i+1}</div></div>
              <div class="jd-pipe-content">
                <div class="jd-pipe-head">
                  <span class="jd-pipe-title">${esc(s.title)}</span>
                  <span class="jd-pipe-dur">${esc(s.dur)}</span>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    </section>

    <!-- Block 8: CTA -->
    <section class="jd-cta">
      <div class="wrap">
        <div class="jd-cta-inner">
          <div class="jd-cta-joe">
            <img src="./Joe Bone/joe-rum-nobg.png" alt="Cap'n Joe Bone with a rum — ready to apply" />
          </div>
          <h2>Give Joe a Rum<br>&amp; Start Applying</h2>
<a href="/?pour=1" class="jd-cta-btn">
            Apply for Position <span class="ar">→</span>
          </a>
          <div class="jd-guarantee"><b>30-day guarantee:</b> no offer = full refund. No questions asked.</div>
        </div>
      </div>
    </section>
  `;

  document.getElementById('jdMain').innerHTML = html;

  // Update page title
  document.title = `${job.role} at ${job.co} — Landed`;
})();
</script>
