<title>Full Job Posting — Landed</title>

<style>
  :root {
    --ink:#0a0a0a; --ink-2:#101013; --ink-3:#16161a;
    --line:#22222a; --line-2:#2c2c34;
    --bone:#f4ede0; --bone-2:#bdbcb4;
    --paper:#efe5cf; --paper-2:#d9d2c4; --paper-3:#fdfaf2;
    --mute:#8a8a92; --mute-2:#6a6a72;
    --orange:#ff6a1f; --orange-soft:#ffa56a; --orange-deep:#d44a0a;
    --green:#5ef0a8;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; }
  body { background:var(--ink); color:var(--bone); font-family:'Inter',system-ui,sans-serif; font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  a { color:inherit; text-decoration:none; }
  button { font-family:inherit; cursor:pointer; }

  /* ── NAV ── */
  .nav { position:sticky; top:0; z-index:50; background:rgba(10,10,10,.88); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); height:64px; }
  .nav .wrap { display:flex; justify-content:space-between; align-items:center; height:100%; }
  .nav .logo { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px; letter-spacing:-.01em; }
  .nav .logo b { color:var(--orange); }
  .nav .cta { background:var(--orange); color:var(--ink); padding:10px 20px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px; text-decoration:none; }

  /* ── CENTERED CONTAINER ── */
  .wrap { max-width:1280px; margin:0 auto; padding:0 56px; }

  /* ── FLOATING BACK BUTTON ── */
  .floating-back { position:fixed; left:24px; top:84px; z-index:45; background:rgba(16,16,19,.94); backdrop-filter:blur(10px); border:1px solid var(--line); color:var(--bone); font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.04em; text-decoration:none; display:inline-flex; align-items:center; overflow:hidden; white-space:nowrap; max-width:42px; height:42px; transition:max-width .28s cubic-bezier(.4,0,.2,1), border-color .15s ease, color .15s ease; }
  .floating-back:hover { max-width:260px; border-color:var(--orange); color:var(--orange); }
  .floating-back .arrow { width:42px; height:42px; display:flex; align-items:center; justify-content:center; font-size:16px; flex:0 0 42px; }
  .floating-back .label-expand { padding-right:14px; opacity:0; transition:opacity .2s ease .05s; }
  .floating-back:hover .label-expand { opacity:1; }

  /* ── HERO ── */
  .hero { padding:0; }
  .hero-grid { display:grid; grid-template-columns:1fr 380px; gap:64px; align-items:start; padding:64px 0 80px; }

  .hero .crumb { display:flex; align-items:center; gap:10px; font-family:'JetBrains Mono',monospace; font-size:11.5px; letter-spacing:.06em; color:var(--mute-2); margin-bottom:28px; }
  .hero .crumb .ch { color:var(--line); }
  .hero .crumb .now { color:var(--orange); }

  .hero .co { display:flex; align-items:center; gap:14px; margin-bottom:20px; }
  .hero .co .mark { width:46px; height:46px; background:var(--orange); color:var(--ink); display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px; flex:0 0 46px; }
  .hero .co .meta { display:flex; flex-direction:column; }
  .hero .co .meta .nm { font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:18px; }
  .hero .co .meta .sub { font-size:12.5px; color:var(--mute); font-family:'JetBrains Mono',monospace; margin-top:2px; }

  .hero h1 { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(48px,6vw,84px); letter-spacing:-.038em; line-height:.92; margin:0 0 24px; }
  .hero h1 em { color:var(--orange); font-style:normal; }

  .hero .tags { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:0; }
  .hero .tag { font-family:'JetBrains Mono',monospace; font-size:11.5px; padding:7px 11px; background:var(--ink-2); border:1px solid var(--line); color:var(--bone-2); }
  .hero .tag.good { color:var(--green); border-color:#1e4a32; background:rgba(94,240,168,.05); }
  .hero .tag.warn { color:var(--orange); border-color:#3a1f10; background:rgba(255,106,31,.06); }

  /* About block in hero left */
  .hero-about { margin-top:40px; padding-top:32px; border-top:1px solid var(--line); max-width:560px; }
  .hero-about .ab-h { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--orange); font-weight:700; margin-bottom:18px; }
  .hero-about h3 { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:26px; letter-spacing:-.02em; margin:0 0 14px; line-height:1.15; }
  .hero-about p { font-size:15px; color:var(--bone-2); line-height:1.65; margin:0 0 14px; }
  .hero-about .pill { display:inline-flex; align-items:center; gap:8px; padding:6px 10px; background:rgba(255,106,31,.12); border:1px solid var(--orange-deep); color:var(--orange); font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.04em; font-weight:600; margin-top:6px; }

  /* Why this role quote in hero left */
  .hero-quote { margin-top:40px; padding-top:32px; border-top:1px solid var(--line); max-width:560px; }
  .hero-quote .qt-label { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--orange); font-weight:700; margin-bottom:18px; }
  .hero-quote .qt-q { font-family:'Instrument Serif',serif; font-style:italic; font-size:22px; line-height:1.4; color:var(--bone); margin:0 0 18px; letter-spacing:-.005em; }
  .hero-quote .qt-who { display:flex; align-items:center; gap:12px; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--mute); letter-spacing:.04em; }
  .hero-quote .qt-who .av { width:32px; height:32px; border-radius:50%; overflow:hidden; flex:0 0 auto; background:var(--line); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:11px; color:var(--mute); }
  .hero-quote .qt-who .av img { width:100%; height:100%; object-fit:cover; }
  .hero-quote .qt-who b { color:var(--bone); }

  /* 30/90/365 mini preview */
  .hero-outcomes { margin-top:40px; padding-top:32px; border-top:1px solid var(--line); }
  .hero-outcomes .lab { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--orange); font-weight:700; margin-bottom:18px; }
  .hero-outcomes .row { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .hero-outcomes .c { background:var(--ink-2); border:1px solid var(--line); padding:16px 18px; }
  .hero-outcomes .c .n { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:30px; color:var(--orange); letter-spacing:-.02em; line-height:1; }
  .hero-outcomes .c .u { font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--mute); font-weight:600; margin:6px 0 12px; }
  .hero-outcomes .c p { font-size:13px; color:var(--bone-2); line-height:1.45; margin:0; }

  /* ── STICKY RAIL ── */
  .rail { position:sticky; top:24px; display:flex; flex-direction:column; gap:14px; }

  .joe-frame { background:radial-gradient(ellipse at center top, rgba(255,106,31,.22) 0%, transparent 60%); padding:14px 0 0; text-align:center; }
  .joe-frame img { width:200px; filter:drop-shadow(0 22px 36px rgba(255,106,31,.45)); }

  .card { background:var(--ink-2); border:1px solid var(--line); padding:22px; }
  .card-h { font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--mute); font-weight:600; margin:0 0 16px; }

  .match-card .top { display:flex; align-items:center; gap:16px; margin-bottom:16px; }
  .match-card .ring { width:72px; height:72px; flex:0 0 auto; border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative; }
  .match-card .ring::after { content:''; position:absolute; inset:6px; background:var(--ink-2); border-radius:50%; }
  .match-card .ring span { position:relative; z-index:1; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px; }
  .match-card .top .lbl { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px; line-height:1.1; }
  .match-card .top .sub { font-size:12.5px; color:var(--mute); margin-top:4px; }
  .match-card .br { display:grid; grid-template-columns:1fr auto; gap:6px; padding:11px 0; border-top:1px solid var(--ink-3); font-size:12.5px; align-items:center; }
  .match-card .br .k { color:var(--bone-2); }
  .match-card .br .v { font-family:'JetBrains Mono',monospace; font-size:11.5px; }
  .match-card .br .v.ok { color:var(--green); }
  .match-card .br .v.miss { color:var(--orange); }

  .facts-card .row { display:grid; grid-template-columns:1fr auto; gap:10px; padding:11px 0; border-bottom:1px solid var(--ink-3); align-items:center; }
  .facts-card .row:last-child { border-bottom:0; padding-bottom:0; }
  .facts-card .row .k { font-size:12.5px; color:var(--mute); }
  .facts-card .row .v { font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13.5px; color:var(--bone); }
  .facts-card .row .v.acc { color:var(--orange); }
  .facts-card .row .v.dim { color:var(--bone-2); }

  .apply-rail-btn { background:var(--orange); color:var(--ink); padding:18px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center; gap:10px; width:100%; cursor:pointer; border:0; text-decoration:none; transition:background .15s; }
  .apply-rail-btn:hover { background:#ff7a30; }
  .save-rail-btn { background:transparent; border:1px solid var(--line); color:var(--bone); padding:13px; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13.5px; width:100%; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; }
  .guarantee-card { padding:14px 16px; background:var(--ink-2); border:1px solid #1e4a32; font-size:12.5px; color:var(--bone-2); line-height:1.5; }
  .guarantee-card b { color:var(--green); }

  /* ── SKILLS — paper ── */
  .skills { padding:80px 0; background:var(--paper); color:var(--ink); border-bottom:1px solid var(--paper-2); }
  .skills h2 { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(38px,5vw,64px); letter-spacing:-.035em; margin:0 0 40px; line-height:1; color:var(--ink); }
  .skills h2 em { color:var(--orange); font-style:normal; }
  .skills .twocol { display:grid; grid-template-columns:1fr 1fr; gap:64px; margin-bottom:48px; border-top:1px solid rgba(10,10,10,.2); padding-top:36px; }
  .skills .col h4 { font-family:'JetBrains Mono',monospace; font-size:11.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--mute-2); font-weight:600; margin:0 0 22px; padding-bottom:12px; border-bottom:1px solid rgba(10,10,10,.18); }
  .skills .col .item { display:grid; grid-template-columns:30px 1fr; gap:12px; padding:14px 0; border-bottom:1px solid rgba(10,10,10,.12); align-items:start; }
  .skills .col .item:last-child { border-bottom:0; }
  .skills .col .item .num { font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--orange-deep); font-weight:600; padding-top:2px; }
  .skills .col.nice .item .num { color:var(--mute-2); }
  .skills .col .item .txt { font-size:15px; color:var(--ink); line-height:1.5; }
  .skills .stack-label { font-family:'JetBrains Mono',monospace; font-size:11.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--mute-2); font-weight:600; margin-bottom:14px; }
  .skills .stack { display:flex; flex-wrap:wrap; gap:8px; }
  .skills .stack .chip { font-family:'JetBrains Mono',monospace; font-size:13px; padding:8px 14px; background:var(--paper-3); border:1px solid var(--paper-2); color:var(--ink); }
  .skills .stack .chip.core { background:rgba(255,106,31,.14); border-color:var(--orange-deep); color:var(--orange-deep); }

  /* ── TEAM — dark ── */
  .team { padding:80px 0; background:var(--ink); border-top:1px solid var(--ink-3); }
  .team h2 { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(32px,4vw,52px); letter-spacing:-.03em; margin:0 0 40px; line-height:1; }
  .team .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
  .team .card-row { padding:32px; border:1px solid var(--line); background:var(--ink-2); }
  .team .card-row .k { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--orange); font-weight:600; margin-bottom:18px; }
  .team .card-row .who { display:flex; align-items:center; gap:14px; margin-bottom:14px; }
  .team .card-row .who .av { width:48px; height:48px; border-radius:50%; background:var(--line); overflow:hidden; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px; color:var(--mute); }
  .team .card-row .who .av img { width:100%; height:100%; object-fit:cover; }
  .team .card-row .who .meta { font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16px; }
  .team .card-row .who .meta .role { font-family:'Inter',sans-serif; font-weight:400; font-size:12.5px; color:var(--mute); margin-top:2px; }
  .team .card-row p { font-size:14.5px; color:var(--bone-2); line-height:1.55; margin:0; }
  .team .card-row .chip { display:inline-block; margin-top:14px; padding:5px 10px; background:var(--ink); border:1px solid var(--line); font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--green); letter-spacing:.04em; }

  /* ── BENEFITS — paper ── */
  .benefits { padding:80px 0; background:var(--paper); color:var(--ink); border-top:1px solid var(--paper-2); border-bottom:1px solid var(--paper-2); }
  .benefits .head { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:36px; gap:48px; }
  .benefits h2 { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(32px,4vw,52px); letter-spacing:-.03em; margin:0; line-height:1; }
  .benefits .head .note { font-family:'Instrument Serif',serif; font-style:italic; font-size:16px; color:var(--mute-2); white-space:nowrap; }
  .benefits .grid { display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:150px; gap:16px; }
  .benefits .b { background:var(--ink); color:var(--bone); padding:24px; overflow:hidden; }
  .benefits .b .hd { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--mute); font-weight:600; margin-bottom:14px; }
  .benefits .b .v { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:26px; letter-spacing:-.01em; line-height:1.1; }
  .benefits .b .v small { display:block; font-family:'Inter',sans-serif; font-weight:400; font-size:13px; color:var(--mute); margin-top:6px; letter-spacing:0; line-height:1.4; }
  .benefits .b.hero-b { grid-column:span 2; background:var(--orange); color:var(--ink); }
  .benefits .b.hero-b .hd { color:#3a1a0a; }
  .benefits .b.hero-b .v { font-size:38px; }
  .benefits .b.hero-b .v small { color:#3a1a0a; }
  .benefits .b.wide { grid-column:span 2; }

  /* ── PROCESS — dark ── */
  .process { padding:80px 0; background:var(--ink); border-top:1px solid var(--ink-3); }
  .process .head { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:48px; gap:32px; }
  .process h2 { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(32px,4vw,52px); letter-spacing:-.03em; margin:0; line-height:1; }
  .process .total { font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--green); letter-spacing:.06em; white-space:nowrap; }
  .process .total b { color:var(--bone); }
  .process .flow { display:grid; grid-template-columns:repeat(4,1fr); position:relative; }
  .process .flow::before { content:''; position:absolute; top:24px; left:24px; right:24px; height:1px; background:linear-gradient(to right, var(--orange) 0%, var(--orange) 90%, transparent 100%); }
  .process .stp { position:relative; padding-right:24px; }
  .process .stp .ring { width:48px; height:48px; border-radius:50%; background:var(--ink); border:2px solid var(--orange); display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--orange); font-size:18px; margin-bottom:22px; position:relative; z-index:1; }
  .process .stp h5 { font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:18px; margin:0 0 8px; }
  .process .stp p { font-size:14px; color:var(--mute); line-height:1.5; margin:0 0 12px; }
  .process .stp p b { color:var(--bone); }
  .process .stp .meta { font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--green); letter-spacing:.05em; }
  .process .stp .meta .sep { color:var(--line); margin:0 6px; }

  /* ── APPLY — paper ── */
  .apply { background:var(--paper); color:var(--ink); padding:80px 0; border-top:1px solid var(--paper-2); }
  .apply .top { display:grid; grid-template-columns:1fr 220px; gap:48px; align-items:end; margin-bottom:40px; }
  .apply h2 { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(32px,4vw,56px); letter-spacing:-.035em; line-height:.95; margin:0; }
  .apply h2 em { color:var(--orange); font-style:normal; }
  .apply .top .joe { text-align:right; }
  .apply .top .joe img { width:200px; filter:drop-shadow(0 22px 36px rgba(255,106,31,.45)); }

  .apply .form-paper { display:flex; flex-direction:column; gap:36px; }
  .apply .field-lab { display:flex; align-items:baseline; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--mute-2); font-weight:700; margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--paper-2); }
  .apply .field-lab .on-file { color:var(--orange-deep); margin-left:8px; font-size:10.5px; letter-spacing:.1em; }
  .apply .field-lab .hint { font-family:'Inter',sans-serif; font-size:11.5px; color:var(--mute-2); letter-spacing:.04em; text-transform:none; font-weight:400; }
  .apply .field-lab .hint .action { color:var(--orange-deep); text-decoration:underline; text-underline-offset:3px; cursor:pointer; }
  .apply .upload-paper { background:var(--paper-3); border:1px solid var(--paper-2); padding:22px 24px; display:flex; align-items:center; gap:16px; }
  .apply .upload-paper .ic { width:46px; height:46px; background:#3a1a0a; color:var(--orange); display:flex; align-items:center; justify-content:center; font-size:20px; flex:0 0 auto; }
  .apply .upload-paper .cap { font-size:14px; color:var(--mute-2); line-height:1.5; }
  .apply .upload-paper .cap b { color:var(--ink); display:block; font-size:15.5px; font-weight:600; margin-bottom:2px; }

  .apply .question-block { border-left:3px solid var(--orange); padding-left:24px; }
  .apply .question-block .qp { font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:22px; line-height:1.4; color:var(--ink); margin-bottom:18px; max-width:780px; }
  .apply .question-block textarea { background:var(--paper-3); border:1px solid var(--paper-2); color:var(--ink); padding:16px 18px; font-family:'Inter',sans-serif; font-size:14.5px; width:100%; min-height:130px; resize:vertical; outline:none; line-height:1.55; }
  .apply .question-block textarea:focus { border-color:var(--orange); }
  .apply .question-block textarea::placeholder { color:var(--mute); }

  .apply .submit-paper { display:grid; grid-template-columns:1fr auto; gap:24px; align-items:center; padding-top:28px; border-top:1px solid var(--paper-2); }
  .apply .submit-paper .guarantee { font-size:13.5px; color:var(--mute-2); line-height:1.5; }
  .apply .submit-paper .guarantee b { color:var(--orange-deep); font-family:'JetBrains Mono',monospace; }

  .apply-big { background:var(--orange); color:var(--ink); padding:16px 24px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15.5px; border:0; cursor:pointer; display:inline-flex; align-items:center; gap:10px; text-decoration:none; transition:transform .12s ease, background .15s ease; white-space:nowrap; }

            <p>${coDesc}</p>
            <span class="pill">${esc(stage.toUpperCase())}</span>
          </div>

          <div class="hero-quote">
            <div class="qt-label">Why this role is open</div>
            <p class="qt-q">"${esc(whyOpen)}"</p>
            <div class="qt-who">
              <div class="av">HM</div>
              <span>— <b>Hiring Manager</b> · ${esc(job.co)}</span>
            </div>
          </div>

          <div class="hero-outcomes">
            <div class="lab">Success looks like</div>
            <div class="row">
              <div class="c"><div class="n">30</div><div class="u">days</div><p>${esc(g30)}</p></div>
              <div class="c"><div class="n">90</div><div class="u">days</div><p>${esc(g90)}</p></div>
              <div class="c"><div class="n">365</div><div class="u">days</div><p>${esc(g365)}</p></div>
            </div>
          </div>
        </div>

        <!-- Right: sticky rail -->
        <aside class="rail">

          <div class="joe-frame">
            <img src="./Joe Bone/joe-bone-tablet.svg" alt="Captain Joe Bone" />
          </div>

          <div class="card match-card">
            <h5 class="card-h">Your match · why</h5>
            <div class="top">
              <div class="ring" style="${scoreStyle}">
                <span style="color:${scoreColor}">${score}</span>
              </div>
              <div>
                <div class="lbl">${esc(scoreLabel)}</div>
                <div class="sub">Based on your shortlist profile</div>
              </div>
            </div>
            <div class="br"><span class="k">Role · years · stack</span><span class="v ok">✓ matched</span></div>
            <div class="br"><span class="k">Comp expectations</span><span class="v ok">✓ within range</span></div>
            <div class="br"><span class="k">Location · async</span><span class="v ok">✓ aligned</span></div>
            <div class="br"><span class="k">Visa sponsorship</span><span class="v ${job.visa ? 'ok' : 'miss'}">${job.visa ? '✓ available' : '⚠ unavailable'}</span></div>
          </div>

          <div class="card facts-card">
            <h5 class="card-h">The 30-second pitch</h5>
            <div class="row"><div class="k">Base</div><div class="v acc">${esc(job.pay)}</div></div>
            <div class="row"><div class="k">Equity</div><div class="v">${esc(equity)}</div></div>
            <div class="row"><div class="k">Location</div><div class="v">${esc(job.loc)}</div></div>
            ${coreHours ? `<div class="row"><div class="k">Core hours</div><div class="v">${esc(coreHours)}</div></div>` : ''}
            <div class="row"><div class="k">Type</div><div class="v">${esc(empType)}</div></div>
            <div class="row"><div class="k">Visa</div><div class="v ${job.visa ? '' : 'dim'}">${esc(visaText)}</div></div>
            <div class="row"><div class="k">Process</div><div class="v">~4h · 2–3 weeks</div></div>
          </div>

          <a class="apply-rail-btn" href="#apply">Apply now →</a>
          <button class="save-rail-btn">★ Save for later</button>

          <div class="guarantee-card">
            <b>30-day Landed guarantee.</b> If you don't get an offer through us, we refund every cent — no questions asked.
          </div>

        </aside>
      </div>
      </div>
    </section>

    <!-- SKILLS — paper -->
    <section class="skills">
      <div class="wrap">
      <div class="head">
        <h2>Skills &amp; <em>stack.</em></h2>
      </div>
      <div class="twocol">
        <div class="col must">
          <h4>Must-have</h4>
          ${(job.reqs||[]).map((r,i) => `<div class="item"><div class="num">0${i+1}</div><div class="txt">${esc(r)}</div></div>`).join('')}
        </div>
        <div class="col nice">
          <h4>Nice-to-have</h4>
          ${niceArr.map(n => `<div class="item"><div class="num">+</div><div class="txt">${esc(n)}</div></div>`).join('')}
        </div>
      </div>
      <div class="stack-label">Tech stack · what the team actually uses</div>
      <div class="stack">
        ${stackShow.map(t => `<span class="chip${coreSet.has(t) ? ' core' : ''}">${esc(t)}</span>`).join('')}
      </div>
      </div>
    </section>

    <!-- TEAM — dark -->
    <section class="team">
      <div class="wrap">
      <h2>Team &amp; work style</h2>
      <div class="grid">
        <div class="card-row">
          <div class="k">Reports to</div>
          <div class="who">
            <div class="av"><img src="./HR.jpg" alt="" /></div>
            <div class="meta">${esc(team.reportsTo)}<div class="role">${esc(job.co)}</div></div>
          </div>
          <p>You'll meet your manager in week one. They run the team async-first with one weekly all-hands. Quarterly offsites in person.</p>
          <span class="chip">Weekly 1:1 · 30 min</span>
        </div>
        <div class="card-row">
          <div class="k">Your pod</div>
          <div class="who">
            <div class="av"><img src="./Collegue.png" alt="" /></div>
            <div class="meta">Cross-functional pod<div class="role">${esc(team.comp)}</div></div>
          </div>
          <p>You'll own roadmap and outcomes for your area. Direct line to engineering and design — no proxy layers in between.</p>
          <span class="chip">+ sibling pods</span>
        </div>
        <div class="card-row">
          <div class="k">Work paradigm</div>
          <div class="who">
            <div class="av" style="background:var(--green);color:var(--ink);">A→</div>
            <div class="meta">${esc(team.paradigm)}<div class="role">+ 1 weekly sync per pod</div></div>
          </div>
          <p>Decisions live in Linear and Notion. Slack is for nudges, not work. Default meeting is no meeting — bring a written brief.</p>
          <span class="chip">≈ 2h synchronous / week</span>
        </div>
      </div>
      </div>
    </section>

    <!-- BENEFITS — paper -->
    <section class="benefits">
      <div class="wrap">
      <div class="head">
        <h2>Benefits, honestly.</h2>
        <div class="note">Everything below is funded — not "available to discuss."</div>
      </div>
      <div class="grid">
        <div class="b hero-b"><div class="hd">Compensation</div><div class="v">${esc(job.pay)}<small>USD base + ${esc(equity)} equity · 4-yr vest, 1-yr cliff</small></div></div>
        <div class="b"><div class="hd">Medical</div><div class="v">100%<small>Medical, dental, vision · 80% for dependents</small></div></div>
        <div class="b"><div class="hd">Retirement</div><div class="v">4% match<small>401(k), vests immediately</small></div></div>
        <div class="b wide"><div class="hd">Time off</div><div class="v">Unlimited PTO<small>With a 21-day annual MINIMUM — enforced via calendar audit.</small></div></div>
        <div class="b"><div class="hd">Learning</div><div class="v">$1,500<small>Annual L&amp;D budget · receipts only</small></div></div>
        <div class="b"><div class="hd">Home office</div><div class="v">$2,000<small>One-time setup stipend</small></div></div>
        <div class="b"><div class="hd">Offsites</div><div class="v">2× / year<small>Whole-company, flights covered</small></div></div>
        <div class="b"><div class="hd">Visa</div><div class="v">${job.visa ? 'H1B sponsor' : 'No sponsorship'}<small>${job.visa ? 'H1B and OPT supported' : "You'll need work auth where you are"}</small></div></div>
      </div>
      </div>
    </section>

    <!-- PROCESS — dark -->
    <section class="process">
      <div class="wrap">
      <div class="head">
        <h2>Hiring process</h2>
        <div class="total">total time: <b>≈ 4h</b> · over 2–3 weeks</div>
      </div>
      <div class="flow">
        ${pipeline.map((s,i) => `
          <div class="stp">
            <div class="ring">${i+1}</div>
            <h5>${esc(s.title)}</h5>
            <p>${esc(s.desc)}</p>
            <div class="meta">${esc(s.dur)}<span class="sep">·</span>Zoom</div>
          </div>
        `).join('')}
      </div>
      </div>
    </section>

    <!-- APPLY — paper -->
    <section class="apply" id="apply">
      <div class="wrap">
      <div class="top">
        <div>
          <h2>One question.<br>Not a <em>cover letter.</em></h2>
        </div>
        <div class="joe">
          <img src="./joe-bone-salute.svg" alt="Joe salutes" />
        </div>
      </div>

      <div class="form-paper">

        <div>
          <div class="field-lab">
            <span>Resume <span class="on-file">✓ on file</span></span>
            <span class="hint"><a class="action" href="#">Replace</a> · <a class="action" href="#">View</a></span>
          </div>
          <div class="upload-paper">
            <div class="ic">✓</div>
            <div class="cap"><b>resume.pdf</b>Uploaded · auto-attached to your application</div>
          </div>
        </div>

        <div>
          <div class="field-lab">
            <span>One question <span style="color:var(--mute);margin-left:6px;">optional</span></span>
            <span class="hint">200 words max · bullets fine</span>
          </div>
          <div class="question-block">
            <div class="qp">${esc(screenQ)}</div>
            <textarea placeholder="Be specific — concrete examples beat vague claims every time."></textarea>
          </div>
        </div>

        <div class="submit-paper">
          <div class="guarantee">
            <b>30-day Landed guarantee.</b> No offer = full refund. We read every answer within 48 hours.
          </div>
          <a class="apply-big" id="applySubmit" href="#" onclick="payOpen(event)">
            Apply for ${esc(roleCta)} · ${esc(job.co)} →
          </a>
        </div>

      </div>
      </div>
    </section>

    <div class="bottom-spacer"></div>
  `;

  document.getElementById('jdMain').innerHTML = sectionsHtml;
  document.title = `${job.role} at ${job.co} — Landed`;

  // ── Sticky Bottom Bar ────────────────────────────────────────
  document.getElementById('stickyBar').innerHTML = `
    <div class="l">
      <div class="ring" style="${scoreStyle}">
        <span style="color:${scoreColor}">${score}</span>
      </div>
      <div class="info">
        <div class="role-name">${esc(job.role)} · <span style="color:var(--orange)">${esc(job.co)}</span></div>
        <div class="sub">${esc(scoreLabel)} · <b>${esc(job.pay)}</b> · ${esc(job.loc)}</div>
      </div>
      <div class="divider"></div>
      <div class="pair">Process · <b>~4h · 2–3w</b></div>
    </div>
    <div class="r">
      <button class="save-s">★ Save</button>
      <a class="apply-s" href="#apply">Apply for ${esc(roleCta)} →</a>
    </div>
  `;

  // ── IntersectionObserver: show sticky bar when hero leaves view ──
  const hero = document.getElementById('hero');
  const bar  = document.getElementById('stickyBar');
  if (hero && bar) {
    new IntersectionObserver((entries) => {
      entries.forEach(e => bar.classList.toggle('show', !e.isIntersecting));
    }, { rootMargin:'-120px 0px 0px 0px', threshold:0 }).observe(hero);
  }

})();
</script>

<script src="paywall.js"></script>
<script src="buynow.js"></script>
<script src="https://assets.calendly.com/assets/external/widget.js" type="text/javascript" async></script>
</body>
