      <circle cx="188" cy="514" r="5"></circle>
    </g>
    
    <path d="M 56 396 Q 64 384 92 384 L 138 388 L 132 414 L 88 410 Q 62 408 56 396 Z" fill="url(#gold)" stroke="#5a3a0e" stroke-width="1"></path>
    <g stroke="#6a4410" stroke-width="1.3" stroke-linecap="round">
      <line x1="72" y1="414" x2="68" y2="436"></line>
      <line x1="82" y1="416" x2="80" y2="440"></line>
      <line x1="92" y1="416" x2="92" y2="438"></line>
      <line x1="102" y1="416" x2="106" y2="438"></line>
