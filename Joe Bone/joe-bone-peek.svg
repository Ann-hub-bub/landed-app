  <path d="M 14 -4 L 14 -22 Q 14 -28 20 -28 Q 26 -28 26 -22 L 26 4 Z" fill="url(#bone)" stroke="#7a6238" stroke-width="1.2"></path>
  <path d="M 2 -4 L 2 -20 Q 2 -26 8 -26 Q 14 -26 14 -20 L 14 4 Z" fill="url(#bone)" stroke="#7a6238" stroke-width="1.2"></path>
  <path d="M -10 -2 L -10 -16 Q -10 -22 -4 -22 Q 2 -22 2 -16 L 2 4 Z" fill="url(#bone)" stroke="#7a6238" stroke-width="1.2"></path>
  <g stroke="#5a4a28" stroke-width=".8" opacity=".5">
    <line x1="-4" y1="-12" x2="-4" y2="-4"></line>
    <line x1="8" y1="-14" x2="8" y2="-4"></line>
    <line x1="20" y1="-16" x2="20" y2="-4"></line>
    <line x1="32" y1="-18" x2="32" y2="-4"></line>
  </g>
</g>

</svg>