      <path d="M -8 -2 L -2 11 L 4 -2 Z" fill="url(#gold)" stroke="#5a3a0e" stroke-width=".6"></path>
    </g>

    
    <path d="M 318 162 L 168 348" stroke="#0a0a0a" stroke-width="11" stroke-linecap="round" fill="none"></path>
    <path d="M 318 162 L 168 348" stroke="#2a2218" stroke-width="4.5" stroke-linecap="round" fill="none" opacity=".85"></path>
    <g stroke="#1a1208" stroke-width="1.6" stroke-linecap="round">
      <line x1="226" y1="252" x2="240" y2="240"></line>
      <line x1="248" y1="278" x2="262" y2="266"></line>
    </g>
  </g>

  
  <g>
    <ellipse cx="240" cy="206" rx="172" ry="14" fill="#000" opacity=".4"></ellipse>
    <path d="M 54 198 Q 86 96 240 72 Q 394 96 426 198 Q 410 216 384 218 L 96 218 Q 70 216 54 198 Z" fill="url(#hatGrad)" stroke="#000" stroke-width="1.4"></path>
    <path d="M 96 200 Q 130 124 240 102 Q 350 124 384 200" stroke="#3a3a44" stroke-width="2" fill="none" opacity=".55"></path>
    <path d="M 54 198 Q 86 96 240 72 Q 394 96 426 198" stroke="url(#gold)" stroke-width="2.4" fill="none"></path>
    <path d="M 78 174 Q 56 138 78 102 Q 100 130 94 174 Z" fill="#bf2a1a"></path>
    <g>
      <line x1="58" y1="200" x2="44" y2="232" stroke="url(#gold)" stroke-width="2.2"></line>
      <circle cx="42" cy="238" r="4.5" fill="url(#gold)"></circle>
    </g>
    <g transform="translate(240 144)">
      <circle r="32" fill="#0a0a0a" stroke="url(#gold)" stroke-width="2.6"></circle>
      <g stroke="url(#bone)" stroke-width="4.5" stroke-linecap="round">
        <line x1="-20" y1="-14" x2="20" y2="16"></line>
        <line x1="-20" y1="16" x2="20" y2="-14"></line>
      </g>
      <g>
        <ellipse cx="0" cy="-1" rx="10" ry="11" fill="url(#bone)" stroke="#5a4a28" stroke-width=".7"></ellipse>
        <ellipse cx="-3.6" cy="-1" rx="2.2" ry="2.8" fill="#0a0a0a"></ellipse>
        <ellipse cx="3.6" cy="-1" rx="2.2" ry="2.8" fill="#0a0a0a"></ellipse>
        <rect x="-4" y="6.5" width="8" height="3.2" fill="url(#bone)"></rect>
      </g>
    </g>
  </g>

</g>

<!-- DEPTH LAYER 1: skull-meets-edge cast shadow on the block (pronounced, multi-stop) -->
<ellipse cx="316" cy="260" rx="60" ry="42" fill="url(#skullContact)"></ellipse>
<ellipse cx="310" cy="300" rx="36" ry="70" fill="url(#skullContact)" opacity=".75"></ellipse>
<ellipse cx="304" cy="360" rx="22" ry="60" fill="url(#skullContact)" opacity=".55"></ellipse>
<!-- DEPTH LAYER 2: ambient occlusion stripe where skull contour touches block face -->
<path d="M 295 232 L 305 232 L 305 388 L 295 388 Z" fill="#000" opacity=".5"></path>

<!-- HAT rendered OUTSIDE the figure clip and AFTER the dark block,
     so the tricorn brim's right peak naturally pokes past the block's top edge. -->
<g transform="translate(-46 60)">
  <ellipse cx="240" cy="206" rx="172" ry="14" fill="#000" opacity=".4"></ellipse>
  <path d="M 54 198 Q 86 96 240 72 Q 394 96 426 198 Q 410 216 384 218 L 96 218 Q 70 216 54 198 Z" fill="url(#hatGrad)" stroke="#000" stroke-width="1.4"></path>
  <path d="M 96 200 Q 130 124 240 102 Q 350 124 384 200" stroke="#3a3a44" stroke-width="2" fill="none" opacity=".55"></path>
  <path d="M 54 198 Q 86 96 240 72 Q 394 96 426 198" stroke="url(#gold)" stroke-width="2.4" fill="none"></path>
  <path d="M 96 218 L 384 218" stroke="url(#gold)" stroke-width="1.6" fill="none" opacity=".7"></path>
  <!-- plume -->
  <path d="M 78 174 Q 56 138 78 102 Q 100 130 94 174 Z" fill="#bf2a1a"></path>
  <!-- left tassel -->
  <g>
    <line x1="58" y1="200" x2="44" y2="232" stroke="url(#gold)" stroke-width="2.2"></line>
    <circle cx="42" cy="238" r="4.5" fill="url(#gold)"></circle>
  </g>
  <!-- right tassel (now visible because hat isn't clipped) -->
  <g>
    <line x1="422" y1="200" x2="436" y2="232" stroke="url(#gold)" stroke-width="2.2"></line>
    <circle cx="438" cy="238" r="4.5" fill="url(#gold)"></circle>
  </g>
  <!-- skull-and-crossbones medallion -->
  <g transform="translate(240 144)">
    <circle r="32" fill="#0a0a0a" stroke="url(#gold)" stroke-width="2.6"></circle>
    <g stroke="url(#bone)" stroke-width="4.5" stroke-linecap="round">
      <line x1="-20" y1="-14" x2="20" y2="16"></line>
      <line x1="-20" y1="16" x2="20" y2="-14"></line>
    </g>
    <g>
      <ellipse cx="0" cy="-1" rx="10" ry="11" fill="url(#bone)" stroke="#5a4a28" stroke-width=".7"></ellipse>
      <ellipse cx="-3.6" cy="-1" rx="2.2" ry="2.8" fill="#0a0a0a"></ellipse>
      <ellipse cx="3.6" cy="-1" rx="2.2" ry="2.8" fill="#0a0a0a"></ellipse>
      <rect x="-4" y="6.5" width="8" height="3.2" fill="url(#bone)"></rect>
    </g>
  </g>
  <!-- soft shadow the hat brim casts onto the dark block beneath it -->
  <path d="M 332 220 Q 366 230 392 220 L 388 240 Q 360 248 336 238 Z" fill="url(#brimCast)" opacity=".95"></path>
  <path d="M 336 218 Q 366 226 384 218" stroke="#000" stroke-width="2" fill="none" opacity=".55"></path>
</g>


<g transform="translate(284 366) rotate(10)">
  <path d="M -6 -4 L 30 -4 L 26 28 L -10 28 Z" fill="url(#bone)" stroke="#7a6238" stroke-width="1.4"></path>
