<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" aria-label="Capt. Joe Bone — peeking">
<defs>
  <radialGradient id="halo" cx=".2" cy=".4" r=".55">
    <stop offset="0" stop-color="#ff6a1f" stop-opacity=".22"></stop>
    <stop offset=".55" stop-color="#ff6a1f" stop-opacity=".05"></stop>
    <stop offset="1" stop-color="#0a0a0a" stop-opacity="0"></stop>
  </radialGradient>
  <radialGradient id="eyeBlue" cx=".4" cy=".4" r=".6">
    <stop offset="0" stop-color="#e8f6ff"></stop>
    <stop offset=".22" stop-color="#a8e8ff"></stop>
    <stop offset=".62" stop-color="#3a9ad4"></stop>
    <stop offset="1" stop-color="#0a2a48"></stop>
  </radialGradient>
  <linearGradient id="blockFace" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1a1a22"></stop>
    <stop offset=".25" stop-color="#13131a"></stop>
    <stop offset="1" stop-color="#06060a"></stop>
  </linearGradient>
  <linearGradient id="blockTop" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#34343e"></stop>
    <stop offset="1" stop-color="#0a0a10"></stop>
  </linearGradient>
  <radialGradient id="brimCast" cx=".5" cy="0" r=".8">
    <stop offset="0" stop-color="#000" stop-opacity=".75"></stop>
    <stop offset="1" stop-color="#000" stop-opacity="0"></stop>
  </radialGradient>
  <radialGradient id="eyeRed" cx=".4" cy=".4" r=".6">
    <stop offset="0" stop-color="#ffe0a8"></stop>
    <stop offset=".22" stop-color="#ff8a3a"></stop>
    <stop offset=".62" stop-color="#d92a05"></stop>
    <stop offset="1" stop-color="#4a0500"></stop>
  </radialGradient>
  <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f1e6c9"></stop>
    <stop offset=".55" stop-color="#e6d6b1"></stop>
    <stop offset="1" stop-color="#cdba8d"></stop>
  </linearGradient>
  <linearGradient id="hatGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0c0c12"></stop>
    <stop offset=".5" stop-color="#1c1c24"></stop>
    <stop offset="1" stop-color="#06060a"></stop>
  </linearGradient>
  <linearGradient id="uniform" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1d1d24"></stop>
    <stop offset="1" stop-color="#0c0c11"></stop>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffd58a"></stop>
    <stop offset=".5" stop-color="#e8a23a"></stop>
    <stop offset="1" stop-color="#7a4a14"></stop>
  </linearGradient>
  <filter id="eyeGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"></feGaussianBlur>
    <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
  </filter>
  <clipPath id="cropL">
    <rect x="0" y="0" width="320" height="600"></rect>
  </clipPath>
  <radialGradient id="skullContact" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#000" stop-opacity=".55"></stop>
    <stop offset="1" stop-color="#000" stop-opacity="0"></stop>
  </radialGradient>
  <linearGradient id="edgeShadow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#000" stop-opacity="0"></stop>
    <stop offset="1" stop-color="#000" stop-opacity=".55"></stop>
  </linearGradient>
</defs>


<ellipse cx="100" cy="280" rx="260" ry="280" fill="url(#halo)"></ellipse>


<!-- DIMENSIONAL DARK BLOCK — starts below the hat with rounded top-left corner.
     Layered: face gradient + beveled top edge highlight + inner edge shadow + ambient occlusion at corner. -->
<!-- 1. block face with vertical gradient (lighter near top, darker below) -->
<path d="M 318 200
         L 480 200
         L 480 600
         L 290 600
         L 290 228
         Q 290 200 318 200 Z" fill="url(#blockFace)"></path>

<!-- 2. beveled TOP edge — catches light, sells horizontal surface -->
<path d="M 318 200 L 480 200 L 480 212 L 290 212 L 290 228 Q 290 200 318 200 Z"
      fill="url(#blockTop)"></path>
<!-- top-edge highlight stroke -->
<path d="M 480 201 L 320 201 Q 292 202 291 226" fill="none" stroke="#4a4a58" stroke-width="1.4" opacity=".9"></path>
<!-- thinner inner highlight on the rounded corner -->
<path d="M 290 226 Q 290 203 316 203" fill="none" stroke="#6a6a78" stroke-width=".8" opacity=".75"></path>

<!-- 3. left vertical edge — darker shadow channel selling the block's depth -->
<path d="M 290 228 L 290 600 L 306 600 L 306 232 Q 306 216 318 216 Q 290 216 290 228 Z"
      fill="#000" opacity=".55"></path>

<!-- 4. wood-grain / column texture (very subtle vertical streaks on the face) -->
<g stroke="#1a1a22" stroke-width="1" opacity=".55">
  <line x1="330" y1="230" x2="330" y2="600"></line>
  <line x1="360" y1="212" x2="360" y2="600"></line>
  <line x1="402" y1="212" x2="402" y2="600"></line>
  <line x1="438" y1="212" x2="438" y2="600"></line>
  <line x1="468" y1="212" x2="468" y2="600"></line>
</g>

<!-- 5. ambient occlusion in the corner (where hat / skull will sit) -->
<ellipse cx="308" cy="218" rx="30" ry="14" fill="#000" opacity=".35"></ellipse>


<g clip-path="url(#cropL)" transform="translate(-46 60)">

  
  <g>
    <path d="M 38 540 L 78 410 Q 102 388 142 380 L 240 372 L 320 380 L 320 540 Z" fill="url(#uniform)"></path>
    <path d="M 240 372 L 170 462 L 224 538 L 240 498 Z" fill="#05050a"></path>
    <path d="M 240 372 L 170 462 L 224 538" stroke="url(#gold)" stroke-width="2.4" fill="none" stroke-linecap="round"></path>
    <path d="M 220 372 L 240 392 L 246 384 L 244 416 L 226 416 Z" fill="#b8200f"></path>
    <g fill="url(#gold)" stroke="#5a3a0e" stroke-width=".8">
