    <g transform="translate(148 484)" stroke="url(#gold)" stroke-width="2.2" fill="none" stroke-linecap="round">
      <circle cx="0" cy="-10" r="2.4" fill="url(#gold)" stroke="none"></circle>
      <line x1="0" y1="-7" x2="0" y2="12"></line>
      <line x1="-6" y1="-3" x2="6" y2="-3"></line>
      <path d="M -10 6 Q 0 20 10 6"></path>
    </g>
  </g>

  
  <g>
    <path d="M 240 174 C 172 174 138 222 138 272 C 138 308 152 336 168 352 L 174 370 Q 180 386 196 391 L 208 394 Q 240 401 272 394 L 284 391 Q 300 386 306 370 L 312 352 C 328 336 342 308 342 272 C 342 222 308 174 240 174 Z" fill="url(#bone)" stroke="#7a6238" stroke-width="1.6"></path>
    <path d="M 160 278 Q 178 322 198 340" stroke="#b7a47a" stroke-width="2" fill="none" opacity=".55" stroke-linecap="round"></path>
    <path d="M 138 244 Q 130 256 138 268 Q 146 262 152 270 L 150 280 Q 138 280 134 270 Z" fill="#0a0a0a" opacity=".82"></path>
    <path d="M 184 196 L 178 220 L 192 234" stroke="#8a6f40" stroke-width="1.6" fill="none" opacity=".75"></path>
    <path d="M 228 178 L 222 212 L 230 244" stroke="#8a6f40" stroke-width="1.2" fill="none" opacity=".7"></path>

    <path d="M 162 248 Q 198 232 234 252" stroke="#070708" stroke-width="7" stroke-linecap="round" fill="none"></path>
    <path d="M 250 252 Q 284 232 318 248" stroke="#070708" stroke-width="7" stroke-linecap="round" fill="none"></path>

    <g>
      <ellipse cx="200" cy="270" rx="32" ry="34" fill="#040406"></ellipse>
      <ellipse cx="200" cy="274" rx="25" ry="27" fill="#020203"></ellipse>
      <ellipse cx="200" cy="272" rx="15" ry="13" fill="#0a0a0a"></ellipse>
      <path d="M 172 284 Q 200 264 228 254" stroke="#5a3a18" stroke-width="3.4" fill="none" stroke-linecap="round"></path>
      <path d="M 172 284 Q 200 264 228 254" stroke="#2a1a08" stroke-width="1.8" fill="none" stroke-linecap="round" opacity=".95"></path>
      <g stroke="#1a1208" stroke-width="1.8" stroke-linecap="round">
        <line x1="178" y1="276" x2="182" y2="288"></line>
        <line x1="188" y1="270" x2="192" y2="282"></line>
        <line x1="200" y1="264" x2="204" y2="276"></line>
        <line x1="212" y1="258" x2="216" y2="270"></line>
        <line x1="222" y1="252" x2="226" y2="262"></line>
      </g>
      <path d="M 196 288 Q 194 298 198 308" stroke="#5a0f08" stroke-width="1.8" fill="none" stroke-linecap="round" opacity=".9"></path>
    </g>
    <g>
      <ellipse cx="286" cy="270" rx="24" ry="27" fill="#070708"></ellipse>
      <ellipse cx="286" cy="273" rx="18" ry="20" fill="#000"></ellipse>
      <circle cx="289" cy="270" r="10" fill="#3aa6e8" opacity=".25"></circle>
      <circle cx="289" cy="270" r="6.5" fill="url(#eyeBlue)" opacity=".98"></circle>
      <circle cx="288" cy="268" r="1.8" fill="#e8f6ff"></circle>
    </g>

    <path d="M 240 298 L 226 328 Q 240 336 254 328 Z" fill="#070708"></path>

    
    <g transform="translate(232 358) rotate(-4)">
      <path d="M -46 -4 Q 0 -10 46 -4 L 44 18 Q 0 24 -44 18 Z" fill="#040406"></path>
      <g fill="url(#bone)" stroke="#3a3026" stroke-width=".6">
        <path d="M -44 -2 L -38 11 L -32 -2 Z"></path>
        <path d="M -32 -2 L -26 11 L -20 -2 Z"></path>
        <path d="M -20 -2 L -14 11 L -8 -2 Z"></path>
        <path d="M 4 -2 L 10 11 L 16 -2 Z"></path>
        <path d="M 16 -2 L 22 11 L 28 -2 Z"></path>
