    <stop offset=".22" stop-color="#ff8a3a"></stop>
    <stop offset=".62" stop-color="#d92a05"></stop>
    <stop offset="1" stop-color="#4a0500"></stop>
  </radialGradient>
  <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f1e6c9"></stop>
    <stop offset=".55" stop-color="#e6d6b1"></stop>
    <stop offset="1" stop-color="#cdba8d"></stop>
  </linearGradient>
  <linearGradient id="hatGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0c0c12"></stop>
    <stop offset=".5" stop-color="#1c1c24"></stop>
    <stop offset="1" stop-color="#06060a"></stop>
  </linearGradient>
  <linearGradient id="uniform" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1d1d24"></stop>
    <stop offset="1" stop-color="#0c0c11"></stop>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffd58a"></stop>
    <stop offset=".5" stop-color="#e8a23a"></stop>
    <stop offset="1" stop-color="#7a4a14"></stop>
