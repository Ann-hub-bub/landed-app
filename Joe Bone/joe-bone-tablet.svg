<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" aria-label="Capt. Joe Bone — reviewing on tablet">
<defs>
  <radialGradient id="halo" cx=".5" cy=".34" r=".62">
    <stop offset="0" stop-color="#ff6a1f" stop-opacity=".28"></stop>
    <stop offset=".55" stop-color="#ff6a1f" stop-opacity=".05"></stop>
    <stop offset="1" stop-color="#0a0a0a" stop-opacity="0"></stop>
  </radialGradient>
  <radialGradient id="screenGlow" cx=".5" cy=".5" r=".6">
    <stop offset="0" stop-color="#a8e6ff" stop-opacity=".75"></stop>
    <stop offset=".55" stop-color="#5ec8ff" stop-opacity=".25"></stop>
    <stop offset="1" stop-color="#5ec8ff" stop-opacity="0"></stop>
  </radialGradient>
  <radialGradient id="skullGlow" cx=".5" cy=".9" r=".55">
    <stop offset="0" stop-color="#b8e8ff" stop-opacity=".75"></stop>
    <stop offset=".5" stop-color="#6cb8e8" stop-opacity=".25"></stop>
    <stop offset="1" stop-color="#5ec8ff" stop-opacity="0"></stop>
  </radialGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9be8ff"></stop>
    <stop offset=".4" stop-color="#5fc8ff"></stop>
    <stop offset="1" stop-color="#2a7aa8"></stop>
  </linearGradient>
  <radialGradient id="eyeRed" cx=".4" cy=".4" r=".6">
